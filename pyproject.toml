[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsoc-pulse-model"
version = "0.12.0"
description = "Golden, cycle-accurate, and generated-Verilog models for the ZU27DR pulse system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rfsoc_pulse_model.config" = ["default.json", "ip_architecture.json"]

[tool.unittest]
start-directory = "tests"
